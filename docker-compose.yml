services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railsahayak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railsahayak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_COMM_WS_URL: ${NEXT_PUBLIC_COMM_WS_URL:-ws://localhost:8001}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      comms:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/railsahayak
      DATABASE_URL_TEST: postgresql://postgres:postgres@db:5432/railsahayak_test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  comms:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "backend/communication/ws_server.py"]
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  pgdata:
